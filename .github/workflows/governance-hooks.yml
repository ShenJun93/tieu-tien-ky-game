name: Repository Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-gate:
    name: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime info
        run: |
          node --version
          git --version

      - name: Governance regression suite
        run: node --test scripts/hooks/hooks.test.mjs
