name: Repository Gate

# The job id and name stay `repository-gate`: branch protection on main
# requires a check with exactly that name (ADR 004).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-gate:
    name: repository-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Runtime info
        run: |
          node --version
          git --version

      - name: Unity .meta integrity
        run: node tools/ci/check-meta.mjs

      - name: Repository tool tests
        run: node --test tools/ci/check-meta.test.mjs scripts/device/device-verify.test.mjs scripts/assets/asset-intake.test.mjs
